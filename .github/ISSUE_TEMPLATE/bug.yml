name: Bug
description: Something is broken
labels: ["bug"]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Web, Mobile, API / backend, Database, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Tap ...\n3. See error"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
